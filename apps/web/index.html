<!doctype html>
<html lang="ne">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3B2418" />
    <!--
      Content Security Policy (docs/security.md). Vite fills %VITE_API_URL% / %VITE_GAME_SERVER_URL%
      at build time, so only our own API and game server may be contacted. Google Identity needs
      its script, styles and iframe; fonts come from Google Fonts. 'unsafe-inline' is for style
      attributes only (React inline styles); scripts are never inline.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' %VITE_API_URL% %VITE_GAME_SERVER_URL% https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>झण्डी बुर्जा</title>
  </head>
  <body class="bg-wood text-cream antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
