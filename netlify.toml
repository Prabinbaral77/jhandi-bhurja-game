# Netlify site for the web app only (apps/web). The API and game server are Node processes
# and cannot run on Netlify — see docs/deploy.md ("Netlify + Render" and the free Oracle VM).
[build]
  base = "apps/web"
  command = "pnpm --filter @jhandi/web build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"
  # Set these in Netlify → Site configuration → Environment variables (not here):
  # VITE_API_URL, VITE_GAME_SERVER_URL, VITE_GOOGLE_CLIENT_ID, VITE_BASE_PATH (empty or /game/)
