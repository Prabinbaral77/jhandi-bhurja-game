# Render Blueprint — ONE free web service runs the game server AND the API (SERVE_API=true).
# Free plan: no card needed, 750 instance-hours/month (one always-on service fits), sleeps after
# 15 min idle and wakes in ~30-60 s on the next request. Region Singapore (~60 ms to the Mumbai DB).
# Deploy: Render dashboard → New → Blueprint → this repo → fill the `sync: false` values.
services:
  - type: web
    name: jhandi
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: cd apps/game-server && node --import tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_API
        value: "true"
      - key: GAME_SERVER_PORT
        fromService: { type: web, name: jhandi, envVarKey: PORT }
      # Proxy hops in front of the app: Render's edge (1) + Netlify's /api proxy (1).
      - key: TRUST_PROXY
        value: "2"
      # Seconds a matchmade seat stays reserved while the WebSocket connects (default 15).
      - key: COLYSEUS_SEAT_RESERVATION_TIME
        value: "60"
      - key: DATABASE_URL
        sync: false # Supabase SESSION pooler string (port 5432)
      - key: DATABASE_POOL_MAX
        value: "4"
      - key: AUTH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false # e.g. https://jhandi.netlify.app or https://game.prabinbaral.com.np
      - key: WEB_BASE_PATH
        value: ""
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: REDIS_URL
        value: ""
      # Bot-hosted public tables that are always open (one bot account per table).
      - key: HOUSE_BOTS
        value: "Pokhara,Kathmandu,Butwal,Mustang"
      - key: HOUSE_BOT_COINS
        value: "50000"
      - key: HOUSE_BOT_DEPOSIT
        value: "20000"
