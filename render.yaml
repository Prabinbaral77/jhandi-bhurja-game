# Render Blueprint — ONE free web service runs the game server AND the API (SERVE_API=true).
# Free plan: no card needed, 750 instance-hours/month (one always-on service fits), sleeps after
# 15 min idle and wakes in ~30-60 s on the next request. Region Singapore (~60 ms to the Mumbai DB).
# Deploy: Render dashboard → New → Blueprint → this repo → fill the `sync: false` values.
services:
  - type: web
    name: jhandi
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: cd apps/game-server && node --import tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_API
        value: "true"
      - key: GAME_SERVER_PORT
        fromService: { type: web, name: jhandi, envVarKey: PORT }
      # Proxy hops in front of the app: Render's edge (1) + Netlify's /api proxy (1).
      - key: TRUST_PROXY
        value: "2"
      - key: DATABASE_URL
        sync: false # Supabase SESSION pooler string (port 5432)
      - key: DATABASE_POOL_MAX
        value: "4"
      - key: AUTH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false # e.g. https://jhandi.netlify.app or https://game.prabinbaral.com.np
      - key: WEB_BASE_PATH
        value: ""
      # The web app calls the API through Netlify at https://<site>/api/* (same-site cookie).
      - key: API_PUBLIC_PREFIX
        value: "/api"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: REDIS_URL
        value: ""
